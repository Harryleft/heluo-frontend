<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="40"
  height="40"
  role="img"
  aria-label="河洛历史名人发现平台"
>
  <title>河洛历史名人发现平台</title>
  <defs>
    <!-- 印章纹理渐变 -->
    <linearGradient id="sealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b4513;stop-opacity:0.85" />
    </linearGradient>
    <!-- 金色点缀渐变 -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a227;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8c547;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 外层方形印章边框 -->
  <rect
    x="4"
    y="4"
    width="56"
    height="56"
    rx="2"
    fill="none"
    stroke="url(#sealGradient)"
    stroke-width="3"
  />

  <!-- 内层装饰线 -->
  <rect
    x="8"
    y="8"
    width="48"
    height="48"
    rx="1"
    fill="none"
    stroke="#c9a227"
    stroke-width="1"
    opacity="0.6"
  />

  <!-- 四角装饰 - 传统印章云纹风格 -->
  <g fill="#c9a227" opacity="0.8">
    <!-- 左上角 -->
    <circle cx="10" cy="10" r="1.5" />
    <!-- 右上角 -->
    <circle cx="54" cy="10" r="1.5" />
    <!-- 左下角 -->
    <circle cx="10" cy="54" r="1.5" />
    <!-- 右下角 -->
    <circle cx="54" cy="54" r="1.5" />
  </g>

  <!-- 河 - 篆书风格 -->
  <!-- 三点水旁 -->
  <g fill="url(#sealGradient)">
    <ellipse cx="16" cy="24" rx="2.5" ry="1.8" />
    <ellipse cx="16" cy="32" rx="2.5" ry="1.8" />
    <ellipse cx="16" cy="40" rx="2.5" ry="1.8" />
  </g>

  <!-- 河的主体部分 -->
  <g fill="#1e3a5f">
    <!-- 横线 -->
    <rect x="22" y="20" width="18" height="2.5" rx="1" />
    <!-- 中间弯曲笔画 -->
    <path d="M22 26 Q25 28 28 26 L32 30 Q35 32 38 30 L40 28" stroke="#1e3a5f" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- 底部横线 -->
    <rect x="22" y="36" width="18" height="2.5" rx="1" />
    <!-- 竖线 -->
    <rect x="26" y="20" width="2" height="18" rx="1" />
  </g>

  <!-- 洛 - 篆书风格 -->
  <!-- 三点水旁 -->
  <g fill="url(#sealGradient)">
    <ellipse cx="16" cy="48" rx="2.5" ry="1.8" />
    <ellipse cx="16" cy="54" rx="2.5" ry="1.8" />
  </g>

  <!-- 洛的主体 - 各字 -->
  <g fill="#1e3a5f">
    <!-- 上部口字 -->
    <rect x="22" y="45" width="10" height="8" rx="1" fill="none" stroke="#1e3a5f" stroke-width="2" />
    <!-- 中间部分 -->
    <path d="M24 55 L30 55 L28 58 L26 58 Z" fill="#1e3a5f" />
    <!-- 下部日字 -->
    <rect x="32" y="46" width="12" height="10" rx="1" fill="none" stroke="#1e3a5f" stroke-width="1.5" />
    <line x1="32" y1="51" x2="44" y2="51" stroke="#1e3a5f" stroke-width="1" />
    <line x1="38" y1="46" x2="38" y2="56" stroke="#1e3a5f" stroke-width="1" />
  </g>

  <!-- 金色印章落款点缀 -->
  <g fill="url(#goldAccent)" opacity="0.9">
    <rect x="46" y="46" width="2" height="2" rx="0.5" />
    <rect x="50" y="46" width="2" height="2" rx="0.5" />
    <rect x="46" y="50" width="2" height="2" rx="0.5" />
    <rect x="50" y="50" width="2" height="2" rx="0.5" />
  </g>

  <!-- 底部小字标识 -->
  <text
    x="32"
    y="62"
    font-family="serif"
    font-size="4"
    fill="#8b4513"
    text-anchor="middle"
    opacity="0.7"
  >
    历史名人
  </text>
</svg>
