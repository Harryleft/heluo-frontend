<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="40"
  height="40"
  role="img"
  aria-label="河洛历史名人发现平台"
>
  <title>河洛历史名人发现平台</title>

  <!-- 定义渐变 -->
  <defs>
    <linearGradient id="riverGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d5a87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a6831b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景：透明 -->

  <!-- 两河交汇的波浪 -->
  <!-- 黄河波浪 - 下方深色波浪 -->
  <path
    d="M 4 38
       Q 12 32, 20 36
       T 36 38
       T 52 36
       T 60 38
       L 60 46
       Q 52 42, 44 44
       T 28 44
       T 12 46
       L 4 46 Z"
    fill="url(#riverGradient)"
    opacity="0.8"
  />

  <!-- 洛河波浪 - 上方浅色波浪 -->
  <path
    d="M 4 30
       Q 14 24, 24 28
       T 44 28
       T 60 30
       L 60 36
       Q 50 32, 40 34
       T 20 34
       Q 12 36, 4 36 Z"
    fill="#2d5a87"
    opacity="0.6"
  />

  <!-- 汇聚点金色装饰 -->
  <circle
    cx="32"
    cy="34"
    r="3"
    fill="url(#goldGradient)"
  />

  <!-- 展开的卷轴 - 底部平台 -->
  <!-- 左卷轴 -->
  <rect
    x="6"
    y="48"
    width="4"
    height="10"
    rx="1"
    fill="#8b4513"
  />
  <!-- 右卷轴 -->
  <rect
    x="54"
    y="48"
    width="4"
    height="10"
    rx="1"
    fill="#8b4513"
  />
  <!-- 卷轴主体 - 展开的书页 -->
  <path
    d="M 10 50
       Q 16 48, 24 49
       T 40 49
       T 54 50
       L 54 56
       Q 46 54, 38 55
       T 22 55
       T 10 56 Z"
    fill="#f5e6d3"
    stroke="#8b4513"
    stroke-width="0.5"
  />
  <!-- 卷轴内容线条 -->
  <line
    x1="18"
    y1="51.5"
    x2="46"
    y2="51.5"
    stroke="#c9a227"
    stroke-width="0.5"
    opacity="0.7"
  />
  <line
    x1="20"
    y1="53.5"
    x2="44"
    y2="53.5"
    stroke="#c9a227"
    stroke-width="0.5"
    opacity="0.7"
  />

  <!-- 顶部金色点缀 - 代表历史的光辉 -->
  <path
    d="M 28 16
       Q 30 12, 32 10
       Q 34 12, 36 16
       Q 38 14, 40 14
       Q 38 18, 36 20
       L 36 22
       L 28 22
       L 28 20
       Q 26 18, 24 14
       Q 26 14, 28 16 Z"
    fill="url(#goldGradient)"
    opacity="0.9"
  />

  <!-- 连接线 - 河流向上流入卷轴 -->
  <line
    x1="32"
    y1="37"
    x2="32"
    y2="48"
    stroke="#c9a227"
    stroke-width="1"
    stroke-dasharray="2,2"
    opacity="0.6"
  />
</svg>
