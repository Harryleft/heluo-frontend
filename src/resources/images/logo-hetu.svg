<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="40"
  height="40"
  role="img"
  aria-label="河洛历史名人发现平台"
>
  <title>河洛历史名人发现平台</title>
  <defs>
    <!-- 渐变：深蓝到金 -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
    </linearGradient>
    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景：九宫格框架 -->
  <rect x="8" y="8" width="48" height="48" rx="6" fill="none" stroke="#1e3a5f" stroke-width="2" />
  
  <!-- 九宫格内格线 -->
  <line x1="24" y1="12" x2="24" y2="52" stroke="#1e3a5f" stroke-width="1" opacity="0.5" />
  <line x1="40" y1="12" x2="40" y2="52" stroke="#1e3a5f" stroke-width="1" opacity="0.5" />
  <line x1="12" y1="24" x2="52" y2="24" stroke="#1e3a5f" stroke-width="1" opacity="0.5" />
  <line x1="12" y1="40" x2="52" y2="40" stroke="#1e3a5f" stroke-width="1" opacity="0.5" />

  <!-- 洛书九宫点阵（按洛书数字排列） -->
  <!-- 左上：4 - 四个点 -->
  <g fill="#c9a227">
    <circle cx="14" cy="14" r="2" />
    <circle cx="18" cy="14" r="2" />
    <circle cx="14" cy="18" r="2" />
    <circle cx="18" cy="18" r="2" />
  </g>

  <!-- 上中：9 - 九个点（三排三列） -->
  <g fill="#c9a227" filter="url(#glow)">
    <circle cx="29" cy="13" r="1.5" />
    <circle cx="32" cy="13" r="1.5" />
    <circle cx="35" cy="13" r="1.5" />
    <circle cx="29" cy="16" r="1.5" />
    <circle cx="32" cy="16" r="1.5" />
    <circle cx="35" cy="16" r="1.5" />
    <circle cx="29" cy="19" r="1.5" />
    <circle cx="32" cy="19" r="1.5" />
    <circle cx="35" cy="19" r="1.5" />
  </g>

  <!-- 右上：2 - 两个点 -->
  <g fill="#8b4513">
    <circle cx="46" cy="16" r="2" />
    <circle cx="50" cy="16" r="2" />
  </g>

  <!-- 左中：3 - 三个点 -->
  <g fill="#8b4513">
    <circle cx="16" cy="29" r="2" />
    <circle cx="16" cy="32" r="2" />
    <circle cx="16" cy="35" r="2" />
  </g>

  <!-- 中心：5 - 五个点（中心加四角） -->
  <g fill="url(#mainGradient)" filter="url(#glow)">
    <circle cx="32" cy="32" r="3.5" />
    <circle cx="26" cy="26" r="2" />
    <circle cx="38" cy="26" r="2" />
    <circle cx="26" cy="38" r="2" />
    <circle cx="38" cy="38" r="2" />
  </g>

  <!-- 右中：7 - 七个点 -->
  <g fill="#8b4513">
    <circle cx="46" cy="27" r="1.5" />
    <circle cx="46" cy="30" r="1.5" />
    <circle cx="46" cy="33" r="1.5" />
    <circle cx="46" cy="36" r="1.5" />
    <circle cx="50" cy="29" r="1.5" />
    <circle cx="50" cy="32" r="1.5" />
    <circle cx="50" cy="35" r="1.5" />
  </g>

  <!-- 左下：8 - 八个点 -->
  <g fill="#8b4513">
    <circle cx="14" cy="45" r="1.5" />
    <circle cx="14" cy="48" r="1.5" />
    <circle cx="14" cy="51" r="1.5" />
    <circle cx="17" cy="45" r="1.5" />
    <circle cx="17" cy="48" r="1.5" />
    <circle cx="17" cy="51" r="1.5" />
    <circle cx="20" cy="48" r="1.5" />
    <circle cx="20" cy="51" r="1.5" />
  </g>

  <!-- 下中：1 - 一个大点（发现之眼） -->
  <circle cx="32" cy="48" r="4" fill="#c9a227" filter="url(#glow)" />

  <!-- 右下：6 - 六个点 -->
  <g fill="#8b4513">
    <circle cx="45" cy="45" r="1.5" />
    <circle cx="45" cy="48" r="1.5" />
    <circle cx="45" cy="51" r="1.5" />
    <circle cx="49" cy="45" r="1.5" />
    <circle cx="49" cy="48" r="1.5" />
    <circle cx="49" cy="51" r="1.5" />
  </g>
</svg>